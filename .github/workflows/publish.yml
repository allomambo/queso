name: Publish package on NPM 📦

on:
    release:
        types: [created]
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    build:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            # Trusted publishing needs npm 11.5.1+. Pin to 11.x: npm@latest (12+) requires Node 22.22.2+.
            - name: Update npm
              run: npm install -g npm@11
            - run: yarn ci
            - run: yarn build:lib

    publish:
        needs: build
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/
            # Trusted publishing needs npm 11.5.1+. Pin to 11.x: npm@latest (12+) requires Node 22.22.2+.
            - name: Update npm
              run: npm install -g npm@11
            - run: npm publish
